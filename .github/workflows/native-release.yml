name: Build and verify v1.0.1 packages

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish v1.0.1 after all packages pass verification
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: unified-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    uses: ./.github/workflows/windows-setup.yml
    with:
      version: '1.0.1'

  macos:
    uses: ./.github/workflows/macos-dmg.yml
    with:
      version: '1.0.1'

  linux:
    uses: ./.github/workflows/linux.yml
    with:
      version: '1.0.1'

  harmonyos:
    uses: ./.github/workflows/harmonyos.yml
    with:
      version: '1.0.1'

  publish:
    if: ${{ inputs.publish && github.repository == 'slirens/xiaohongshu-monitor' && github.ref == 'refs/heads/main' }}
    needs: [windows, macos, linux, harmonyos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: windows-setup-*
          path: packages
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: macos-dmg-*
          path: packages
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: linux-amd64
          path: packages
      - uses: actions/download-artifact@v4
        with:
          name: harmonyos-browser
          path: packages
      - name: Publish all six verified packages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd packages
          packages=(
            xiaohongshu-monitor-v1.0.1-windows-x64-setup.exe
            xiaohongshu-monitor-v1.0.1-windows-x86-setup.exe
            xiaohongshu-monitor-v1.0.1-macos-arm64.dmg
            xiaohongshu-monitor-v1.0.1-macos-x86_64.dmg
            xiaohongshu-monitor-v1.0.1-linux-amd64.deb
            xiaohongshu-monitor-v1.0.1-harmonyos-browser.zip
          )
          sha256sum "${packages[@]}" > SHA256SUMS.txt
          gh release create v1.0.1 "${packages[@]}" SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title 'v1.0.1' \
            --notes-file ../RELEASE.md --latest
