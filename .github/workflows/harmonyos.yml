name: HarmonyOS extension build and verification

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 12
    env:
      VERSION: ${{ inputs.version }}
      BROWSER_VERSION: '158.0.8127.36'
      BROWSER_ARCHIVE_SHA256: 427A02BEB8887CECA6A1847DC67445580741C8C40BD15AF334993D3A59863943
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
      - run: npm ci --ignore-scripts --omit=dev --no-audit --no-fund
      - name: Build and unpack the browser extension ZIP
        shell: pwsh
        run: |
          $extension = Join-Path $env:RUNNER_TEMP 'extension'
          $unpacked = Join-Path $env:RUNNER_TEMP 'unpacked'
          $packages = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'package')
          $archive = Join-Path $packages.FullName "xiaohongshu-monitor-v$env:VERSION-harmonyos-browser.zip"
          node harmonyos/build.mjs $extension $env:VERSION
          if ($LASTEXITCODE) { throw 'Extension build failed.' }
          [System.IO.Compression.ZipFile]::CreateFromDirectory($extension, $archive)
          [System.IO.Compression.ZipFile]::ExtractToDirectory($archive, $unpacked)
          $manifest = Get-Content -LiteralPath (Join-Path $unpacked 'manifest.json') -Raw | ConvertFrom-Json
          if ($manifest.version -ne $env:VERSION) { throw "Unexpected manifest version $($manifest.version)." }
      - name: Set up the pinned Chrome for Testing build
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $archive = Join-Path $env:RUNNER_TEMP 'chrome-win32.zip'
          $browserDir = Join-Path $env:RUNNER_TEMP 'browser'
          $url = "https://storage.googleapis.com/chrome-for-testing-public/$env:BROWSER_VERSION/win32/chrome-win32.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive -TimeoutSec 180
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $env:BROWSER_ARCHIVE_SHA256) {
            throw 'The pinned Chrome for Testing download did not match its checksum.'
          }
          [System.IO.Compression.ZipFile]::ExtractToDirectory($archive, $browserDir)
          $executable = Join-Path $browserDir 'chrome-win32/chrome.exe'
          "XHS_CHROMIUM=$executable" >> $env:GITHUB_ENV
      - name: Verify the packaged extension in Chrome for Testing
        shell: pwsh
        env:
          XHS_RUNTIME: ${{ github.workspace }}
          XHS_TEST_DIRECTORY: ${{ runner.temp }}
          XHS_TEST_EXTENSION: ${{ runner.temp }}/unpacked
          XHS_SCREENSHOT_DIRECTORY: ${{ runner.temp }}/harmonyos-ui
        run: node harmonyos/tests/verify-extension.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: harmonyos-ui
          path: ${{ runner.temp }}/harmonyos-ui
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: harmonyos-browser
          path: ${{ runner.temp }}/package/xiaohongshu-monitor-v${{ inputs.version }}-harmonyos-browser.zip
          if-no-files-found: error
