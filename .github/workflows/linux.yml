name: Linux build, install, and verification

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
      - name: Build DEB x64
        run: |
          bash linux/build-deb.sh "$RUNNER_TEMP/package" "$VERSION"
          installer="$RUNNER_TEMP/package/xiaohongshu-monitor-v$VERSION-linux-amd64.deb"
          test "$(dpkg-deb --field "$installer" Version)" = "$VERSION"
          test "$(dpkg-deb --field "$installer" Architecture)" = amd64
      - uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: ${{ runner.temp }}/package/xiaohongshu-monitor-v${{ inputs.version }}-linux-amd64.deb
          if-no-files-found: error

  verify:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-amd64
          path: ${{ runner.temp }}/package
      - name: Install the downloaded package
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth desktop-file-utils "$RUNNER_TEMP/package/xiaohongshu-monitor-v$VERSION-linux-amd64.deb"
          google-chrome --version
          desktop-file-validate /usr/share/applications/xiaohongshu-monitor.desktop
          test "$(dpkg-query -W -f='${Version}' xiaohongshu-monitor)" = "$VERSION"
      - name: Run the installed desktop app and export Excel
        run: |
          fixture="$RUNNER_TEMP/notes.json"
          printf '%s\n' '[{"title":"测试笔记","body":"宝山 硚口 桌面报告测试","date":"2026-11-23","url":"https://www.xiaohongshu.com/explore/0123456789abcdef01234567"}]' > "$fixture"
          LC_ALL=C.UTF-8 xvfb-run -a xiaohongshu-monitor --verify "$fixture" "$RUNNER_TEMP/ui-state-en"
          LC_ALL=zh_CN.UTF-8 xvfb-run -a xiaohongshu-monitor --verify "$fixture" "$RUNNER_TEMP/ui-state-zh"
      - name: Capture native F+1A interface states
        run: |
          report=$(find "$RUNNER_TEMP/ui-state-en/reports" -maxdepth 1 -name '*.xlsx' -print -quit)
          test -n "$report"
          for language in en zh; do
            if [ "$language" = zh ]; then locale=zh_CN.UTF-8; else locale=C.UTF-8; fi
            LC_ALL="$locale" xvfb-run -a python3 linux/verify-ui.py --app-root /opt/xiaohongshu-monitor \
              --report "$report" --screenshots "$RUNNER_TEMP/linux-ui/$language"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: linux-ui-${{ matrix.os }}
          path: ${{ runner.temp }}/linux-ui
          if-no-files-found: error
      - name: Exercise real Chrome against local search and login fixtures
        run: xvfb-run -a /opt/xiaohongshu-monitor/runtime/node linux/verify-browser.cjs /opt/xiaohongshu-monitor
      - name: Uninstall and verify clean removal
        run: |
          sudo apt-get remove -y xiaohongshu-monitor
          test ! -e /usr/bin/xiaohongshu-monitor
          test ! -e /usr/share/applications/xiaohongshu-monitor.desktop

