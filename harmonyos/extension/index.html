<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小红书舆情监控</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main>
    <header>
      <img src="cover.png" width="72" height="72" alt="">
      <div>
        <h1>小红书舆情监控</h1>
        <p>按关键词和日期检索笔记，导出 Excel。</p>
      </div>
    </header>
    <form id="job">
      <label for="terms">关键词</label>
      <textarea id="terms" name="terms" rows="2" placeholder="用空格分隔，例如 宝山 硚口" required></textarea>
      <div class="two">
        <label>开始日期<input id="start" type="date" required></label>
        <label>结束日期<input id="end" type="date" required></label>
      </div>
      <details>
        <summary>更多设置</summary>
        <div class="two">
          <label>排序<select id="sort"><option>最新</option><option>综合</option></select></label>
          <label>划屏数量<input id="screens" type="number" min="1" max="10000" step="1" placeholder="下拉到底"></label>
          <label>AI 服务商<select id="provider"><option value="">跳过 AI 分析</option></select></label>
          <label>模型<input id="model" type="text" placeholder="使用服务商默认模型" disabled></label>
          <label>API 密钥<input id="key" type="password" autocomplete="off" placeholder="仅用于本次任务" disabled></label>
          <label>报告模板<input id="template" type="file" accept=".md,text/markdown" disabled></label>
        </div>
        <p id="ai-hint" hidden>选用 AI 时，部分笔记标题和正文会发送给所选服务商。</p>
      </details>
      <div class="actions">
        <button type="submit" id="start-job">开始监控</button>
        <button type="button" class="secondary" id="show-browser" hidden>打开采集标签页</button>
        <button type="button" class="secondary" id="stop" hidden>停止</button>
        <button type="button" class="secondary" id="download" hidden>下载 Excel</button>
      </div>
    </form>
    <section class="progress" aria-labelledby="status">
      <h2 id="status" role="status">准备就绪</h2>
      <progress id="progress" value="0" max="1" aria-label="关键词完成进度"></progress>
      <div id="prompt" hidden>
        <p id="prompt-text"></p>
        <label id="prompt-choice-label" hidden>已应用的网页选项<select id="prompt-choice"></select></label>
        <button type="button" id="proceed">继续</button>
      </div>
      <ol id="history"></ol>
    </section>
    <p class="notice">自动化浏览可能触发平台验证或限制。请按平台提示完成登录或验证。</p>
  </main>
  <script type="module" src="app.mjs"></script>
</body>
</html>
