<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-en="Xiaohongshu Monitor">小红书舆情监控</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main class="workbench">
    <aside class="sidebar">
      <img src="cover.png" width="195" height="183" alt="">
      <p class="brand" data-en="Xiaohongshu Monitor">小红书舆情监控</p>
    </aside>
    <div class="workspace">
      <header>
        <h1 data-en="New monitoring task">新建监控任务</h1>
        <p data-en="Collect notes by keyword and date, then export to Excel.">按关键词和日期采集笔记，导出 Excel 报告。</p>
      </header>
      <form id="job">
        <div class="continuation-actions">
          <button type="button" class="secondary" id="continue-job" data-en="Continue monitoring">继续监控</button>
          <button type="button" class="secondary" id="import-report-button" data-en="Import another report" hidden>导入其他报告</button>
          <button type="button" class="secondary" id="clear-report" data-en="New monitoring task" hidden>新建监控</button>
          <input id="import-report" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
          <p id="report-source" role="status" hidden></p>
        </div>
        <label for="terms" data-en="Keywords">关键词</label>
        <textarea id="terms" name="terms" rows="1" placeholder="多个关键词用空格分隔，例如 宝山 硚口" data-en-placeholder="Separate keywords with spaces, e.g. Baoshan Qiaokou" required></textarea>
        <div class="two">
          <label><span data-en="Start date">开始日期</span><input id="start" type="date" required></label>
          <label><span data-en="End date">结束日期</span><input id="end" type="date" required></label>
        </div>
        <details>
          <summary>
            <span data-en="More settings">更多设置</span>
            <span id="settings-summary" class="settings-summary"></span>
          </summary>
          <div class="settings-options">
            <div class="two">
              <label><span data-en="Sort by">排序</span><select id="sort">
                <option value="最新" data-en="Latest">最新</option>
                <option value="综合" data-en="Relevance">综合</option>
              </select></label>
              <label><span data-en="Number of screens">划屏数量</span><input id="screens" type="number" min="1" max="10000" step="1" placeholder="下拉到底" data-en-placeholder="Scroll to end"></label>
              <label><span data-en="AI provider">AI 服务商</span><select id="provider"><option value="" data-en="Skip AI analysis">跳过 AI 分析</option></select></label>
              <label><span data-en="Model">模型</span><input id="model" type="text" placeholder="使用服务商默认模型" data-en-placeholder="Use the provider’s default model" disabled></label>
              <label><span data-en="API key">API 密钥</span><input id="key" type="password" autocomplete="off" placeholder="仅用于本次任务" data-en-placeholder="Used for this task only" disabled></label>
              <label><span data-en="Report template">报告规则模板</span><input id="template" type="file" accept=".md,text/markdown" aria-describedby="template-status"></label>
            </div>
            <p id="template-status" role="status" data-en="Using the built-in template">当前使用内置模板</p>
            <button type="button" class="secondary" id="reset-template" data-en="Use built-in template" hidden>使用内置模板</button>
            <p id="ai-hint" data-en="When AI is enabled, note titles and excerpts are sent to the selected provider." hidden>选用 AI 时，笔记标题和正文片段会发送给所选服务商。</p>
          </div>
        </details>
        <div class="task-bar">
          <p id="status" role="status" data-en="Ready">准备就绪</p>
          <div class="actions">
            <button type="button" class="secondary" id="show-browser" data-en="Open collection tab" hidden>打开采集标签页</button>
            <button type="button" class="secondary" id="stop" data-en="Stop" hidden>停止</button>
            <button type="button" class="secondary" id="download" data-en="Download Excel" hidden>下载 Excel</button>
            <button type="submit" id="start-job" data-en="Start monitoring">开始监控</button>
          </div>
        </div>
      </form>
      <section id="progress-panel" class="progress" aria-labelledby="status" hidden>
        <progress id="progress" value="0" max="1" aria-label="关键词完成进度" data-en-aria="Keyword completion progress"></progress>
        <div id="prompt" hidden>
          <p id="prompt-text"></p>
          <button type="button" id="proceed" data-en="Continue">继续</button>
        </div>
        <ol id="history"></ol>
      </section>
      <p class="notice" data-en="For lawful, non-commercial use only. Automated browsing may trigger platform warnings or restrictions and affect account privileges and reach.">仅限合法、非商业使用。自动化浏览可能触发平台警告或限制，影响账号权益和流量。</p>
    </div>
  </main>
  <script src="exceljs.min.js"></script>
  <script src="jszip.min.js"></script>
  <script type="module" src="app.mjs"></script>
</body>
</html>
